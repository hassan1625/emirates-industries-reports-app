# Shopify app configuration for PRODUCTION (https://reporting.emiratesind.com).
# Push it to Shopify from a developer machine (the server does not need the Shopify CLI):
#     shopify app deploy --config production
# This sets the app's address, permissions and webhooks. Read docs/handover-guide.md section 4
# first: development and production must not share one Shopify app, or the next
# `shopify app dev` would point the live app at a development tunnel.

client_id = "55a91743cf2b14a2f4e1f347dbfc25a2"
application_url = "https://reporting.emiratesind.com"
embedded = true
name = "Emirates Custom Report App"

[access_scopes]
scopes = "read_orders,read_all_orders,read_products,read_locations,read_inventory,read_returns,read_reports"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/bulk-operations-finish"
  topics = [ "bulk_operations/finish" ]

[auth]
redirect_urls = [ "https://reporting.emiratesind.com/api/auth" ]

[build]
# Never let a development session rewrite the production URLs.
automatically_update_urls_on_dev = false
